name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test deployment safeguards
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Validate D1 migrations locally
        run: npm run db:migrate:local
      - name: Validate deployment bundle
        run: npx wrangler deploy --dry-run
      - name: Validate production config with synthetic identifiers
        env:
          CLOUDFLARE_ACCOUNT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CLOUDFLARE_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: npm run build:production && node scripts/check-deploy-config.mjs --dry-run
